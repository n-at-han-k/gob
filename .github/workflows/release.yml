name: Release binary

# Builds gob ahead-of-time with spinel and attaches standalone binaries to a
# release -- no Ruby on the target machine, and no Nix store either.
#
# Deliberately thin. Everything that decides *how* gob is built lives in
# flake.nix: the spinel toolchain, the patched gem sources, the -I feature
# roots that stand in for RubyGems, the raised stack limit and the static
# link. This file runs `nix build` per platform and uploads what falls out, so
# the build is identical to the one a developer gets locally.
#
# Contrast with native.yml, which builds the *gem* (CRuby plus c-shared Go
# libraries). This is the other distribution: one file, nothing to install.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (created if it does not exist)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nix_system }}
    runs-on: ${{ matrix.runner }}
    # Whole-program type inference over gob's dependency graph (rubocop,
    # parser, prism, syntax_tree) dominates the build and is single-threaded;
    # locally it runs for well over ten minutes before it even starts
    # emitting C. The default 360 is plenty, but be explicit about why.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Keyed on Nix's system strings, because that is what the flake selects
      # on. The runner labels match native.yml's -- macos-14 and macos-13 are
      # retired and a job asking for either is cancelled before its first
      # step, reporting no error anywhere.
      matrix:
        include:
          - { nix_system: x86_64-linux,   runner: ubuntu-24.04 }
          - { nix_system: aarch64-linux,  runner: ubuntu-24.04-arm }
          - { nix_system: aarch64-darwin, runner: macos-15 }
          - { nix_system: x86_64-darwin,  runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
        with:
          # refs/ is ten submodules of reference material (the Go tree, the
          # syntax_tree family). flake.nix compiles lib/ and exe/ only, so
          # fetching them would add minutes and change nothing.
          submodules: false

      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # spinel forks cc per compile; let it use the whole runner.
            max-jobs = auto

      - name: Build
        run: nix build .#gob -L

      - name: Record the version
        id: version
        run: echo "version=$(nix eval --raw .#gob.version)" >> "$GITHUB_OUTPUT"

      # The whole point of the exercise, so assert it rather than trust it. A
      # binary that still reaches into /nix/store runs on this runner and
      # nowhere else, and that failure would otherwise surface as a bug report
      # from whoever downloaded it.
      - name: Verify it is standalone
        run: |
          bin=$(readlink -f result/bin/gob)
          case "$(uname -s)" in
            Linux)
              file "$bin"
              file "$bin" | grep -q 'statically linked'
              ;;
            Darwin)
              otool -L "$bin"
              # macOS cannot static-link libSystem and does not need to: it
              # lives at a fixed path on every mac. Anything from the store,
              # though, makes the binary unshippable.
              ! otool -L "$bin" | grep -q /nix/store
              ;;
          esac

      - name: Smoke test
        run: |
          ./result/bin/gob version
          ./result/bin/gob help

      - name: Stage the asset
        id: stage
        run: |
          asset="gob-${{ steps.version.outputs.version }}-${{ matrix.nix_system }}"
          # Copied out of the store, not symlinked, and made writable so
          # upload-artifact can read it as an ordinary file.
          install -m 755 result/bin/gob "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"

      - uses: actions/upload-artifact@v7
        with:
          name: gob-${{ matrix.nix_system }}
          path: ${{ steps.stage.outputs.asset }}
          if-no-files-found: error

  release:
    needs: build
    # Only publish when there is a real tag to publish to. A bare
    # workflow_dispatch from a branch leaves github.ref_name as the branch
    # name, which would otherwise cut a release tagged "main"; that run still
    # builds and uploads artifacts, which is what a test dispatch wants.
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          ls -l
          tag="${{ inputs.tag || github.ref_name }}"

          {
            echo "Standalone \`gob\` binaries, compiled ahead of time by spinel."
            echo
            echo "No Ruby runtime required. Linux builds are statically linked;"
            echo "macOS builds link only libSystem."
            echo
            echo '```'
            sha256sum gob-*
            echo '```'
          } > notes.md

          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes-file notes.md
          gh release upload "$tag" gob-* --clobber
