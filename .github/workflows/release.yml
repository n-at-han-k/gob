name: Release binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (created if it does not exist)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nix_system }}
    runs-on: ${{ matrix.runner }}
    # Whole-program type inference over gob's dependency graph (rubocop,
    # parser, prism, syntax_tree) dominates the build and is single-threaded;
    # locally it runs for well over ten minutes before it even starts
    # emitting C. The default 360 is plenty, but be explicit about why.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Keyed on Nix's system strings, because that is what the flake selects
      # on. The runner labels match native.yml's -- macos-14 and macos-13 are
      # retired and a job asking for either is cancelled before its first
      # step, reporting no error anywhere.
      matrix:
        include:
          - { nix_system: x86_64-linux,   runner: ubuntu-24.04 }
          - { nix_system: aarch64-linux,  runner: ubuntu-24.04-arm }
          - { nix_system: aarch64-darwin, runner: macos-15 }
          # No x86_64-darwin lane. Nix itself has dropped it: the 2.36
          # installer has no x86_64-darwin case at all (only aarch64-darwin)
          # and the tarball 404s, so install-nix-action dies with "sorry,
          # there is no binary distribution of Nix for your platform". nixpkgs
          # 26.05 is the last release to support the platform anyway. An Intel
          # mac can still install the gem (native.yml builds that lane).
    steps:
      - uses: actions/checkout@v7
        with:
          # refs/ is ten submodules of reference material (the Go tree, the
          # syntax_tree family). flake.nix compiles lib/ and exe/ only, so
          # fetching them would add minutes and change nothing.
          submodules: false

      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # spinel forks cc per compile; let it use the whole runner.
            max-jobs = auto

      # Caches /nix/store through GitHub's own cache, so no Cachix account or
      # token is needed. The key is the dependency closure, NOT the sources:
      # that way a run whose lib/ changed still restores the spinel toolchain,
      # the gem set and stdenv (minutes of downloads) and only re-does the
      # part that actually changed.
      #
      # Worth being clear about what this does and does not buy: when the
      # sources are untouched the built gob is already in the restored store
      # and `nix build` returns at once, which is what makes re-dispatching
      # this workflow cheap. It cannot shorten a real source change -- that
      # cost is spinel's whole-program inference, and it is unavoidable.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'Gemfile.lock', 'gemset.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          # Save even when the build fails, so a failed run still leaves the
          # dependency closure behind for the next attempt. Debugging this
          # workflow is otherwise a 30-minute round trip every time.
          save: true
          # GitHub allows 10GB of cache per repository, shared across keys.
          gc-max-store-size-linux: 5G
          gc-max-store-size-macos: 5G
          # Keep one cache per key and drop older ones, rather than filling
          # the repository quota with every dependency bump.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build
        run: nix build .#gob -L

      - name: Record the version
        id: version
        run: echo "version=$(nix eval --raw .#gob.version)" >> "$GITHUB_OUTPUT"

      # The whole point of the exercise, so assert it rather than trust it. A
      # binary that still reaches into /nix/store runs on this runner and
      # nowhere else, and that failure would otherwise surface as a bug report
      # from whoever downloaded it.
      - name: Verify it is standalone
        run: |
          bin=$(readlink -f result/bin/gob)
          case "$(uname -s)" in
            Linux)
              file "$bin"
              file "$bin" | grep -q 'statically linked'
              ;;
            Darwin)
              otool -L "$bin"
              # macOS cannot static-link libSystem and does not need to: it
              # lives at a fixed path on every mac. Anything from the store,
              # though, makes the binary unshippable.
              ! otool -L "$bin" | grep -q /nix/store
              ;;
          esac

      - name: Smoke test
        run: |
          ./result/bin/gob version
          ./result/bin/gob help

      - name: Stage the asset
        id: stage
        run: |
          asset="gob-${{ steps.version.outputs.version }}-${{ matrix.nix_system }}"
          # Copied out of the store, not symlinked, and made writable so
          # upload-artifact can read it as an ordinary file.
          install -m 755 result/bin/gob "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"

      - uses: actions/upload-artifact@v7
        with:
          name: gob-${{ matrix.nix_system }}
          path: ${{ steps.stage.outputs.asset }}
          if-no-files-found: error

 
