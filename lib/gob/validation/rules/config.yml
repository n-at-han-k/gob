AllCops:
  DisabledByDefault: true
  TargetRubyVersion: 3.4
  NewCops: disable

Gob/BlockDelimiters:
  Enabled: true

Gob/DeferStatement:
  Enabled: true

Gob/ErrorCheck:
  Enabled: true

Gob/Indentation:
  Enabled: true

Gob/Multiline:
  Enabled: true

Gob/QuoteMarks:
  Enabled: true

Gob/SignatureComment:
  Enabled: true
