AllCops:
  DisabledByDefault: true
  TargetRubyVersion: 3.4
  NewCops: disable

Gob/BlockDelimiters:
  Enabled: true

Gob/DeferStatement:
  Enabled: true

Gob/ErrorCheck:
  Enabled: true

Gob/Indentation:
  Enabled: true

Gob/Multiline:
  Enabled: true

Gob/QuoteMarks:
  Enabled: true

Gob/SignatureComment:
  Enabled: true

Gob/TrailingWhitespace:
  Enabled: true

Gob/VariableDeclaration:
  Enabled: true

Gob/PointerType:
  Enabled: true

Gob/OperatorAssignment:
  Enabled: true

Gob/ZeroBasedRangeLoop:
  Enabled: true

Gob/WordArray:
  Enabled: true

Gob/GoBlock:
  Enabled: true

Gob/GoCall:
  Enabled: true

Gob/RedundantLambdaParentheses:
  Enabled: true

Gob/ThisReceiver:
  Enabled: true

Gob/ArrayLength:
  Enabled: true

Gob/CollectionLiteral:
  Enabled: true

Gob/LambdaSignature:
  Enabled: true

Gob/InvokedLambda:
  Enabled: true

Gob/AttributeType:
  Enabled: true

Gob/SelectBlock:
  Enabled: true

Gob/StructTagPosition:
  Enabled: true
